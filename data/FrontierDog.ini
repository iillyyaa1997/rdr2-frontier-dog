; Frontier Dog settings. Every feature is on by default; 0 turns it off.
[General]
; Language=auto follows the game; or en / ru
Language=auto
DebugLog=0
[Dog]
; 1 = explosions and headshots cannot kill the dog outright (old D81)
ProtectFromInstantDeath=0
; 1 = nothing hurts the dog: no wounds, no reviver needed, it never dies
Invincible=0
AllowEnteringInteriors=0
; the dog puts a carcass it brought onto Arthur's horse (the game's own stow, as its hunters do); 0 = left by the horse
CarryStowOnHorse=1
[Breeds]
EnableShiba=1
[Delivery]
Delivery=1
; 1 = aiming at your dog from beyond the game's focus range (about 15 m) but within whistle range shows its
; commands (Sit/Follow, Home) bottom right
FarCommands=1
DeliveryWhistleHold=0
CourierModel=A_M_M_RANCHER_01
CourierHorse=A_C_Horse_KentuckySaddle_Black
